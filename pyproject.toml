[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "self-agent"
version = "0.2.1"
description = "A private, source-grounded memory service for personal agents"
requires-python = ">=3.11"
dependencies = ["fastapi==0.162.0", "uvicorn==0.54.0", "httpx==0.28.1", "mcp>=1.30.0,<3", "jieba==0.42.1", "cryptography==50.0.2", "PyYAML==6.0.3", "APScheduler==3.11.3", "filelock==4.2.4"]

[project.optional-dependencies]
local = ["mcp-memory-service[sqlite]==12.4.0", "mcp==1.30.0", "FlashRank==0.2.10", "detect-secrets==1.5.0"]
semantic = ["mem0ai==2.2.1", "sentence-transformers==6.2.0"]
history = ["detect-secrets==1.5.0"]
test = ["pytest==9.1.1"]

[project.scripts]
self-agent = "self_agent.cli:main"

[tool.setuptools.packages.find]
include = ["self_agent*"]

[tool.setuptools.package-data]
self_agent = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
